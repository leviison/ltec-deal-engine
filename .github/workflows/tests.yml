name: tests
# Every push and pull request runs the full suite: engine, deal files, tie-outs, parity and dashboard page tests.
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest jsonschema openpyxl
      - run: npm ci
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: python -m pytest -q
